name: Windows RDP (Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Wlaczenie Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

          $Password = ConvertTo-SecureString "TwojeMocneHaslo123!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Instalacja i polaczenie Tailscale
        shell: powershell
        run: |
          # Pobranie i cicha instalacja Tailscale
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

          # Polaczenie z Twoja siecia Tailscale
          $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscalePath up --authkey="${{ secrets.TS_AUTHKEY }}" --hostname="github-windows-vps"

          # Pobranie wewnetrznego adresu IP Tailscale
          $tsIP = (& $tailscalePath ip -4)
          Write-Host "=========================================="
          Write-Host "PODLACZONO DO TAILSCALE!"
          Write-Host "IP MASZYNY: $tsIP"
          Write-Host "LOGIN RDP: runneradmin"
          Write-Host "HASLO RDP: TwojeMocneHaslo123!"
          Write-Host "=========================================="

      - name: Podtrzymanie sesji (6 godzin)
        run: |
          Start-Sleep -Seconds 21600
